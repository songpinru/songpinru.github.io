baseURL: "http://localhost:1313/"
title: "Pinru's Home"
locale: "zh-CN"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
enableGitInfo: true
enableRobotsTXT: true
capitalizeListTitles: false
summaryLength: 80
disablePathToLower: true

outputs:
  home: [html, rss]
  page: [html, markdown]
  section: [html, rss]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
    extensions:
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
        enable: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

enableInlineShortcodes: true

menu:
  main:
    - name: "文档"
      pageRef: /docs
      weight: 1
    - name: "博客"
      pageRef: /blog
      weight: 2
    - name: "搜索"
      weight: 3
      params:
        type: search
    - name: "GitHub"
      url: "https://github.com/songpinru/songpinru.github.io"
      weight: 4
      params:
        icon: github

params:
  description: "SongPinru 的技术笔记、工作经验与学习记录"
  externalLinkDecoration: true

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayPoweredBy: false

  displayUpdatedDate: false
  displayUpdatedAuthor: false
  dateFormat: "2006-01-02"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: full
      maxPageResults: 20
      maxSectionResults: 10

  editURL:
    enable: true
    base: "https://github.com/songpinru/songpinru.github.io/edit/main/content"

  toc:
    displayTags: false

  highlight:
    copy:
      enable: true
      display: hover

  page:
    displayPagination: true
    contextMenu:
      enable: true

  imageZoom:
    enable: true

  math:
    engine: katex

  comments:
    enable: false
